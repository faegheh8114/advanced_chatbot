{% extends "base.html" %}

{% block content %}

<div class="card" style="max-width:500px;">
  <div class="row"><b>رکوردهای ایجادشده:</b> {{ result.created }}</div>
  <div class="row"><b>رکوردهای نادیده گرفته‌شده (تکراری/نامعتبر):</b> {{ result.skipped }}</div>
  <a href="/import" class="btn btn-outline" style="margin-top:14px;">ورود فایل جدید</a>
</div>
{% endblock %}
