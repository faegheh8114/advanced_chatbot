{% extends "base.html" %}
{% block page_title %}{{ t('change_password') }}{% endblock %}
{% block content %}
<div class="card form-card">
  <div class="card-header"><span class="card-title">{{ t('change_password_title') }}</span></div>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label for="current_password">{{ t('current_password') }}</label>
      <input type="password" id="current_password" name="current_password" required>
    </div>
    <div class="form-group">
      <label for="new_password">{{ t('new_password') }}</label>
      <input type="password" id="new_password" name="new_password" required minlength="8">
      <div class="form-hint">{{ t('password_min_hint') }}</div>
    </div>
    <div class="form-group">
      <label for="confirm_password">{{ t('confirm_new_password') }}</label>
      <input type="password" id="confirm_password" name="confirm_password" required minlength="8">
    </div>
    <button type="submit" class="btn btn-primary">{{ t('update_password') }}</button>
  </form>
</div>
{% endblock %}
