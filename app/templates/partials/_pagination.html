{% if pagination and pagination.pages > 1 %}
<nav class="pagination">
  <a class="page-btn {% if not pagination.has_prev %}disabled{% endif %}"
     href="{{ url_for_page(pagination.prev_num) if pagination.has_prev else '#' }}">&laquo; Prev</a>
  <span class="page-info">Page {{ pagination.page }} of {{ pagination.pages }} &middot; {{ pagination.total }} total</span>
  <a class="page-btn {% if not pagination.has_next %}disabled{% endif %}"
     href="{{ url_for_page(pagination.next_num) if pagination.has_next else '#' }}">Next &raquo;</a>
</nav>
{% endif %}
