<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script>
        function sendMessage() {
            var userInput = document.getElementById("userInput").value;
            fetch("/get?msg=" + userInput)
                .then(response => response.text())
                .then(data => {
                    var chatBox = document.getElementById("chatBox");
                    chatBox.innerHTML += "<b>You:</b> " + userInput + "<br>";
                    chatBox.innerHTML += "<b>Bot:</b> " + data + "<br>";
                    document.getElementById("userInput").value = "";
                    chatBox.scrollTop = chatBox.scrollHeight;
                });
        }
    </script>
</head>
<body>
    <h1>🤖 Chatbot</h1>
    <div id="chatBox" style="height:300px; overflow-y:auto; border:1px solid #ccc; padding:10px;"></div>
    <input type="text" id="userInput" placeholder="Type your message here..." onkeypress="if(event.keyCode==13) sendMessage();">
    <button onclick="sendMessage()">Send</button>
</body>
</html>
